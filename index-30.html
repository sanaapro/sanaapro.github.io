<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0E0E0F">
<title>SanaaPro — Create your shop</title>
<style>
  :root{
    --bg:#0E0E0F; --panel:#17181A; --panel2:#1E1F22; --line:#2C2E32; --line2:#3A3D42;
    --gold:#E0B23C; --txt:#EDEBE6; --muted:#98948C;
    --ok:#4FD18B; --okbg:#12301F; --err:#E96B6B; --errbg:#361A1A;
    --serif:Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--txt);
    font-family:var(--sans); display:flex; align-items:flex-start; justify-content:center; padding:20px 16px 44px; }
  .card{ width:100%; max-width:460px; }

  .lang{ display:flex; justify-content:flex-end; }
  .seg{ display:inline-flex; border:1px solid var(--line2); border-radius:20px; overflow:hidden; }
  .seg button{ border:none; background:transparent; color:var(--muted); font-family:var(--sans);
    font-size:12px; font-weight:700; letter-spacing:1px; padding:7px 17px; cursor:pointer; width:auto; margin:0; }
  .seg button.on{ background:var(--gold); color:#141310; }

  .brand{ text-align:center; margin:18px 0 4px; }
  .brand .name{ font-family:var(--serif); font-size:28px; letter-spacing:5px; color:var(--gold);
    text-transform:uppercase; font-weight:700; }
  .brand .sub{ font-size:10px; letter-spacing:2.5px; color:var(--muted); text-transform:uppercase; margin-top:6px; }

  .box{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px 20px; margin-top:22px; }
  h1{ font-family:var(--serif); font-size:19px; color:var(--gold); text-align:center; margin:0 0 6px; font-weight:700; }
  .lead{ text-align:center; color:var(--muted); font-size:13px; margin:0 0 18px; line-height:1.6; }

  label{ display:block; font-size:11px; letter-spacing:.5px; color:var(--muted); margin:15px 0 6px; text-transform:uppercase; }
  input{ width:100%; padding:12px 14px; border:1px solid var(--line2); border-radius:9px;
    font-size:15px; background:#101113; color:var(--txt); font-family:inherit; }
  input::placeholder{ color:#6A665F; }
  input:focus{ outline:none; border-color:var(--gold); }
  .pwrap{ position:relative; }
  .pwrap input{ padding-right:52px; }
  .eye{ position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none; border:none;
    font-size:19px; line-height:1; padding:10px 12px; cursor:pointer; opacity:.45; filter:grayscale(1);
    width:auto; margin:0; }
  .eye.on{ opacity:1; filter:none; }
  .hint{ font-size:12px; color:var(--gold); margin-top:6px; min-height:16px; }

  button{ width:100%; margin-top:22px; padding:15px; border:none; border-radius:10px;
    background:var(--gold); color:#141310; font-size:15px; font-weight:700; cursor:pointer; font-family:var(--sans); }
  button:disabled{ opacity:.45; cursor:default; }

  .msg{ margin-top:16px; font-size:13px; padding:12px 14px; border-radius:9px; display:none; line-height:1.5; }
  .msg.show{ display:block; }
  .msg.err{ background:var(--errbg); color:var(--err); }
  .msg.ok{ background:var(--okbg); color:var(--ok); }

  .done{ display:none; text-align:center; }
  .done.show{ display:block; }
  .done .ident{ display:block; margin:16px 0 6px; padding:14px; background:var(--bg);
    border:1px solid var(--line2); border-radius:10px; font-size:15px; font-weight:700; color:var(--gold); word-break:break-all; }

  .sep{ border-top:1px solid var(--line); margin-top:18px; padding-top:14px; text-align:center; }
  .sep p{ margin:0 0 10px; font-size:13px; color:var(--muted); }
  .sep a{ display:block; padding:13px; border:1px solid var(--line2); border-radius:10px;
    color:var(--txt); font-size:14px; text-decoration:none; }
  .foot{ text-align:center; font-size:11px; color:#5F5B54; margin-top:22px; }
  .price{ text-align:center; font-size:12px; color:var(--muted); margin-top:14px; }
</style>
</head>
<body>
  <div class="card">

    <div class="lang">
      <div class="seg" id="seg"><button data-l="en">EN</button><button data-l="fr">FR</button></div>
    </div>

    <div class="brand">
      <div class="name">SanaaPro</div>
      <div class="sub" data-i="tag">your workshop, online</div>
    </div>

    <div class="box" id="form-view">
      <h1 data-i="title">Create your shop</h1>
      <p class="lead" data-i="lead">It takes a few seconds. Your space is ready straight away.</p>

      <label for="boutique" data-i="lShop">Workshop name</label>
      <input id="boutique" type="text" data-i-ph="phShop" placeholder="e.g. Atelier Fatou" autocomplete="off">
      <div class="hint" id="slug-preview"></div>

      <label for="owner" data-i="lOwner">Your name</label>
      <input id="owner" type="text" data-i-ph="phOwner" placeholder="Your full name" autocomplete="name">

      <label for="email" data-i="lEmail">Email (used to sign in)</label>
      <input id="email" type="email" data-i-ph="phEmail" placeholder="you@email.com" autocomplete="email">

      <label for="pass" data-i="lPass">Password</label>
      <div class="pwrap">
        <input id="pass" type="password" data-i-ph="phPass" placeholder="6 characters minimum" autocomplete="new-password">
        <button class="eye" id="eye-btn" type="button">👁</button>
      </div>

      <label for="wa" data-i="lWa">WhatsApp (optional)</label>
      <input id="wa" type="tel" placeholder="+220 …" autocomplete="tel">

      <button id="submit" data-i="btnCreate">Create my shop</button>
      <div class="msg" id="msg"></div>
      <div class="price" data-i="priceNote">Free for 14 days · then 500 D per month</div>

      <div class="sep">
        <p data-i="haveAcc">Already have an account?</p>
        <a href="../tape-espace/" data-i="signIn">Sign in to your space</a>
      </div>
    </div>

    <div class="box done" id="done-view">
      <h1 style="color:var(--ok)" data-i="doneTitle">✓ Shop created</h1>
      <p class="lead" data-i="doneLead">Your space is ready. Keep these details:</p>
      <span class="ident" id="ident-line"></span>
      <p class="lead" id="trial-note"></p>
      <button id="go" data-i="btnOpen">Open my shop</button>
    </div>

    <div class="foot" data-i="foot">SanaaPro — powered by your workshop</div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, writeBatch, serverTimestamp, Timestamp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCqfAGGU7yFs_QYg70u3e5cNYPXQjRHzsI",
    authDomain: "sanaapro-app.firebaseapp.com",
    projectId: "sanaapro-app",
    storageBucket: "sanaapro-app.firebasestorage.app",
    messagingSenderId: "451762519937",
    appId: "1:451762519937:web:0507928bc9f6ef0c937280"
  };

  const TRIAL_DAYS = 14;
  /* CORRIGÉ : toutes les boutiques partagent la même application, elles sont
     distinguées par le compte utilisé pour se connecter. L'ancienne valeur
     envoyait vers sanaapro.github.io/<slug>/ — une adresse qui n'existe pas. */
  const APP_URL = "https://sanaapro.github.io/tape-espace/";

  const T = {
    en:{
      tag:"your workshop, online", title:"Create your shop",
      lead:"It takes a few seconds. Your space is ready straight away.",
      lShop:"Workshop name", phShop:"e.g. Atelier Fatou",
      lOwner:"Your name", phOwner:"Your full name",
      lEmail:"Email (used to sign in)", phEmail:"you@email.com",
      lPass:"Password", phPass:"6 characters minimum",
      lWa:"WhatsApp (optional)",
      btnCreate:"Create my shop", priceNote:"Free for 14 days · then 500 D per month",
      haveAcc:"Already have an account?", signIn:"Sign in to your space",
      doneTitle:"✓ Shop created", doneLead:"Your space is ready. Keep these details:",
      btnOpen:"Open my shop", foot:"SanaaPro — powered by your workshop",
      identLabel:"Shop ID", checking:"Creating your shop…",
      trialLine:"Free trial of {d} days. Sign in with {e}.",
      errFields:"Please check: workshop name, your name, email, and password (6 characters minimum).",
      errTaken:"That workshop name is already taken. Try a variant.",
      errUsed:"This email already has an account. Sign in instead.",
      errEmail:"Invalid email.", errWeak:"Password too weak (6 characters minimum).",
      errRules:"Registration refused. The name may be taken, or the security rules are not published.",
      errGeneric:"Something went wrong. Please try again.",
      idPreview:"Shop ID: {s}"
    },
    fr:{
      tag:"votre atelier, en ligne", title:"Créez votre boutique",
      lead:"Quelques secondes suffisent. Votre espace est prêt aussitôt.",
      lShop:"Nom de l'atelier", phShop:"Ex. Atelier Fatou",
      lOwner:"Votre nom", phOwner:"Votre nom complet",
      lEmail:"Email (sert à vous connecter)", phEmail:"vous@email.com",
      lPass:"Mot de passe", phPass:"6 caractères minimum",
      lWa:"WhatsApp (optionnel)",
      btnCreate:"Créer ma boutique", priceNote:"Gratuit 14 jours · puis 500 D par mois",
      haveAcc:"Vous avez déjà un compte ?", signIn:"Ouvrir votre espace",
      doneTitle:"✓ Boutique créée", doneLead:"Votre espace est prêt. Notez vos informations :",
      btnOpen:"Ouvrir ma boutique", foot:"SanaaPro — propulsé par votre atelier",
      identLabel:"Identifiant", checking:"Création en cours…",
      trialLine:"Essai gratuit de {d} jours. Connexion avec {e}.",
      errFields:"Vérifiez : nom de l'atelier, votre nom, email, et mot de passe (6 caractères minimum).",
      errTaken:"Ce nom d'atelier est déjà pris. Essayez une variante.",
      errUsed:"Cet email a déjà un compte. Connectez-vous plutôt.",
      errEmail:"Email invalide.", errWeak:"Mot de passe trop faible (6 caractères minimum).",
      errRules:"Inscription refusée. Le nom est peut-être pris, ou les règles de sécurité ne sont pas publiées.",
      errGeneric:"Une erreur est survenue. Réessayez.",
      idPreview:"Identifiant : {s}"
    }
  };

  let L = "en";
  try { L = localStorage.getItem("sanaapro_site_lang") || "en"; } catch(e){}
  if(!T[L]) L = "en";
  const t = k => (T[L] && T[L][k]) || T.en[k] || k;

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const $ = id => document.getElementById(id);

  function applyLang(){
    document.documentElement.lang = L;
    document.querySelectorAll("[data-i]").forEach(el=>{
      const v = t(el.getAttribute("data-i"));
      if(v) el.textContent = v;
    });
    document.querySelectorAll("[data-i-ph]").forEach(el=>{
      const v = t(el.getAttribute("data-i-ph"));
      if(v) el.placeholder = v;
    });
    document.querySelectorAll("#seg button").forEach(b=>{
      b.classList.toggle("on", b.getAttribute("data-l") === L);
    });
    refreshSlug();
  }
  document.querySelectorAll("#seg button").forEach(b=>{
    b.addEventListener("click", ()=>{
      L = b.getAttribute("data-l");
      try { localStorage.setItem("sanaapro_site_lang", L); } catch(e){}
      applyLang();
    });
  });

  $("eye-btn").addEventListener("click", ()=>{
    const p=$("pass"), b=$("eye-btn");
    const show = p.type === "password";
    p.type = show ? "text" : "password";
    b.classList.toggle("on", show);
    p.focus();
  });

  const makeSlug = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40);

  function refreshSlug(){
    const slug = makeSlug($("boutique").value);
    $("slug-preview").textContent = slug ? t("idPreview").replace("{s}", slug) : "";
  }
  $("boutique").addEventListener("input", refreshSlug);

  function show(kind, text){
    const m=$("msg");
    m.className = "msg show " + kind;
    m.textContent = text;
  }

  $("submit").addEventListener("click", async () => {
    const boutique = $("boutique").value.trim();
    const owner = $("owner").value.trim();
    const email = $("email").value.trim();
    const pass = $("pass").value;
    const wa = $("wa").value.trim();
    const slug = makeSlug(boutique);

    if(!boutique || !owner || !email || pass.length < 6 || !slug){
      show("err", t("errFields")); return;
    }

    $("submit").disabled = true;
    show("ok", t("checking"));

    try{
      const slugSnap = await getDoc(doc(db,"slugs",slug));
      if(slugSnap.exists()){
        show("err", t("errTaken")); $("submit").disabled = false; return;
      }

      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      const uid = cred.user.uid;

      const expiresAt = Timestamp.fromMillis(Date.now() + TRIAL_DAYS*24*60*60*1000);
      const batch = writeBatch(db);
      batch.set(doc(db,"slugs",slug), { uid, boutiqueId: uid, createdAt: serverTimestamp() });
      batch.set(doc(db,"boutiques",uid), {
        ownerUid: uid, name: boutique, slug, ownerName: owner, email, whatsapp: wa,
        createdAt: serverTimestamp(),
        subscription: { plan:"trial", status:"active", tier:"standard", startAt: serverTimestamp(), expiresAt }
      });
      batch.set(doc(db,"users",uid), { boutiqueId: uid, slug, role:"owner", createdAt: serverTimestamp() });
      await batch.commit();

      $("form-view").style.display = "none";
      $("done-view").classList.add("show");
      $("ident-line").textContent = t("identLabel") + " : " + slug;
      $("trial-note").textContent = t("trialLine").replace("{d}", TRIAL_DAYS).replace("{e}", email);
      $("go").onclick = () => { window.location.href = APP_URL; };

    }catch(e){
      let m = t("errGeneric");
      if(e.code === "auth/email-already-in-use") m = t("errUsed");
      else if(e.code === "auth/invalid-email") m = t("errEmail");
      else if(e.code === "auth/weak-password") m = t("errWeak");
      else if(e.code === "permission-denied") m = t("errRules");
      show("err", m);
      $("submit").disabled = false;
    }
  });

  applyLang();
</script>
</body>
</html>
